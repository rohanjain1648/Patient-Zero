[project]
name = "patientzero-core"
version = "0.1.0"
description = "Claim provenance and propagation forensics engine, powered by SerpApi"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27"]
llm = ["groq>=0.11", "openai>=1.40"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-dotenv>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The recorded demo session must ship with the package so an installed copy
# can still run zero-key demo mode.
patientzero_api = ["demo_session.json"]
